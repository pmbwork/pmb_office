[package]
name = "pmb-sheets-shell"
version = "0.2.15"
description = "Shell nativa portatile per pmb_office"
edition = "2021"

[lib]
name = "pmb_sheets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# finestre Apri / Salva con nome di Windows (src/file_nativi.rs); stessa libreria e versione di pmb_docs (scelta dell'utente, 2026-11-18)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# finestre Apri / Salva con nome del Mac (src/file_nativi.rs): la libreria del plugin dei dialoghi di Tauri; stessa versione di pmb_docs
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
