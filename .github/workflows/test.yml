# Test automatici dei due programmi a ogni invio di codice (su Linux: costa meno minuti).
name: test
on:
  push:
  workflow_dispatch:
# il token del workflow può solo leggere il codice
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pmb_docs, pmb_sheets/pmb_sheets]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # la macchina di GitHub ha poca memoria: con un processo di prova per ogni processore uno finiva la memoria (pmb_sheets, 22/11)
      - run: npx vitest run --pool=forks --poolOptions.forks.maxForks=2 --poolOptions.forks.minForks=1
        env:
          NODE_OPTIONS: --max-old-space-size=4096
