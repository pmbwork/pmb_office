[package]
name = "pmb-docs-shell"
version = "0.4.8"
description = "Shell nativa portatile per pmb_docs"
edition = "2021"

[lib]
name = "pmb_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# correttore ortografico del Mac (src/ortografia.rs); stesse versioni che usa già Tauri
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
